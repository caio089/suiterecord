<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Ícone do aplicativo Alfredo">
  <defs>
    <linearGradient id="app-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#0F3D46"/>
    </linearGradient>
  </defs>

  <!-- Fundo full-bleed (maskable): preenche todo o canvas, sem cantos próprios
       nem sombra. O launcher/SO aplica a própria máscara arredondada. Sem a
       sombra inferior o bounding box fica simétrico e o ícone deixa de "subir". -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#app-bg)"/>

  <!-- Monograma "A" centralizado no canvas 1024×1024 (dentro da safe zone
       central do ícone adaptativo). translate = centro - centroLocal*escala. -->
  <g transform="translate(194 163.25) scale(3)">
    <path
      d="M42 188 L93 61 Q106 28 119 61 L170 188"
      fill="none"
      stroke="#F7F8FA"
      stroke-width="40"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="106" cy="164" r="13" fill="#1BA6B6"/>
  </g>
</svg>
